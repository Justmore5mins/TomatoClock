<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <meta charset='UTF-8'>
</head>

<body>
    <div style="position: absolute;top: 50%;left: 50%; transform: translate(-50%,-50%);">
        <h1 class="clock" style="margin: 0;"></h1>
    </div>
    <div class="date block">
        <h1 id="date"></h1>
        <hr style="width: 80%;">
        <h1 style="margin-top: 0;">今日日期</h1>
    </div>
    <div class="countdown block">
        <h1 id="countdown">114514</h1>
        <input type="date" id="TargetDate" hidden>
        <hr style="width: 80%;">
        <h1>倒數日</h1>
    </div>

    <div class="subject block">
        <input type="text" placeholder="在做什麼?" id="test" style="padding: 0;">
        <hr style="width: 80%; ;">
        <h1>目前在</h1>
    </div>

    <div class="stopwatch block">
        <h1 id="watch"></h1>
        <hr style="width: 80%;">
        <h1>計時器</h1>
    </div>
</body>
